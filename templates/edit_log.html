{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Log Entry</h1>
    </div>
</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form class="log-form" method="post">

    <div class="form-grid">
        <label>
            Title *
            <input name="title" required value="{{ entry.title }}">
        </label>

        <label>
            Author *
            <input name="author" required value="{{ entry.author.name }}">
        </label>

        <label>
            Type
            <select name="log_type">
                {% for value in ["Work", "Test", "Issue", "Maintenance", "Configuration", "Shift", "Meeting"] %}
                    <option value="{{ value }}" {% if entry.log_type == value %}selected{% endif %}>
                        {{ value }}
                    </option>
                {% endfor %}
            </select>
        </label>

        <label>
            Subsystem
            <input name="subsystem" value="{{ entry.subsystem or '' }}">
        </label>

        <label class="full">
            Tags
            <input name="tags" value="{{ entry.tags|map(attribute='name')|join(', ') }}">
        </label>
    </div>

    <label>
        Report
        <textarea name="result" rows="6">{{ entry.result or '' }}</textarea>
    </label>

    <div class="form-actions">
        <button type="submit">Save Changes</button>
        <a href="{{ url_for('view_log', log_id=entry.id) }}">Cancel</a>
    </div>

</form>

{% endblock %}
